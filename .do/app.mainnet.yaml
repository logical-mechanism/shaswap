# DigitalOcean App Platform spec — ShaSwap PRODUCTION (app.shaswap.org)
#
# This is the public production app on the apex product domain. ShaSwap's contracts are
# LIVE on mainnet (deployed 2026-06-08, tx d56e729c…), so this app serves MAINNET:
# NEXT_PUBLIC_NETWORK=mainnet below.
#
# Create once:  doctl apps create --spec .do/app.mainnet.yaml
# then set BLOCKFROST_PROJECT_ID in the DO console. deploy_on_push rebuilds on every push
# to `main`.
#
# ┌─ MAINNET CONFIG (live) ───────────────────────────────────────────────────────────────┐
# │ • NEXT_PUBLIC_NETWORK=mainnet — build-time inlined, so changing it is a fresh build.   │
# │ • BLOCKFROST_PROJECT_ID (DO console) must be a `mainnet…` project id — the app refuses │
# │   to start if the key prefix doesn't match NEXT_PUBLIC_NETWORK.                        │
# │ • app/src/lib/chain/deployment.ts `mainnet` is deployed:true with the live refs.       │
# └───────────────────────────────────────────────────────────────────────────────────────┘
name: shaswap
region: nyc
services:
  - name: web
    github:
      repo: logical-mechanism/shaswap
      branch: main
      deploy_on_push: true
    source_dir: app
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /
    envs:
      - key: NEXT_PUBLIC_NETWORK
        scope: RUN_AND_BUILD_TIME
        value: mainnet
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        value: https://app.shaswap.org
      # Server-only secret — set in the DO console to a `mainnet…` project id. Its prefix
      # must match NEXT_PUBLIC_NETWORK (the app refuses to start otherwise).
      - key: BLOCKFROST_PROJECT_ID
        scope: RUN_TIME
        type: SECRET
      - key: DATA_PROVIDER
        scope: RUN_TIME
        value: blockfrost
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
domains:
  - domain: app.shaswap.org
    type: PRIMARY
