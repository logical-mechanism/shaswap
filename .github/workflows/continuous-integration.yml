name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@v1
        with:
          # Pinned for reproducible builds — the validators are immutable, so the on-chain
          # script hashes must be re-derivable from source with this exact compiler.
          version: v1.1.22
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build
      # Reproducible-build guard: a fresh build must reproduce the committed plutus.json
      # byte-for-byte. Fails if the committed artifact drifted from source (so a deployed
      # script hash can always be re-derived and verified against the audited source).
      - name: plutus.json is reproducible (no hash drift)
        run: git diff --exit-code plutus.json

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # No Blockfrost key in CI → the data seam falls back to the offline MockProvider,
      # so lint / type-check / tests / build all run without any chain access or secret.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Node 22: the test runner uses `node --experimental-strip-types` (>= 22.6), and an
      # older Node would silently run ZERO tests (guarded by scripts/require-node.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:components
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Playwright drives a headless Chromium against the offline MockProvider (the
      # config's webServer builds + serves the app with DATA_PROVIDER=mock).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
