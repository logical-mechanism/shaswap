name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v3
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.22
      - run: aiken fmt --check
      - run: aiken check -D
      - run: aiken build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # No Blockfrost key in CI → the data seam falls back to the offline MockProvider,
      # so lint / type-check / tests / build all run without any chain access or secret.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Node 22: the test runner uses `node --experimental-strip-types` (>= 22.6), and an
      # older Node would silently run ZERO tests (guarded by scripts/require-node.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
