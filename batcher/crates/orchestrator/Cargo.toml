[package]
name = "orchestrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ShaSwap reference-solver orchestrator: discover → solve → assemble → evaluate (gate) → submit a settlement against a live preprod node (Kupo + Ogmios)."

[[bin]]
name = "shaswap-batcher"
path = "src/main.rs"

[dependencies]
solver-core = { path = "../solver-core" }
txbuild = { path = "../txbuild" }
chain = { path = "../chain" }
pallas-addresses = "1.0.0"
pallas-crypto = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Graceful shutdown: flip a flag on SIGTERM/SIGINT so the daemon exits cleanly
# between passes (systemd sends SIGTERM). Tiny, synchronous, no async runtime.
signal-hook = "0.3"

[lints]
workspace = true
