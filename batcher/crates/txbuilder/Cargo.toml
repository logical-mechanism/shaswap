[package]
name = "shaswap-txbuilder"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Vendored fork of pallas-txbuilder 1.0.0 (TxPipe, Apache-2.0) with withdrawal + reward-redeemer support added — required to build ShaSwap's withdraw-0 settlement anchor, which upstream cannot express. See src/lib.rs for the fork note."

[dependencies]
pallas-codec = "1.0.0"
pallas-crypto = "1.0.0"
pallas-primitives = "1.0.0"
pallas-traverse = "1.0.0"
pallas-addresses = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"

[dev-dependencies]
pallas-addresses = "1.0.0"
pallas-primitives = "1.0.0"
pallas-codec = "1.0.0"
pallas-crypto = "1.0.0"

# Vendored upstream code; keep it building as-is rather than churning it to satisfy
# our workspace lint profile. Our additions are reviewed in the diff vs 1.0.0.
[lints.clippy]
all = "allow"
