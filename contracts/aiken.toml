plutus = "v3"
license = "Apache-2.0"
description = "ShaSwap on-chain validators — batch-auction DEX (settlement anchor, order, pool, pool_mint)"

[repository]
user = "logicalmechanism"
project = "contracts"
platform = "github"

[[dependencies]]
name = "aiken-lang/stdlib"
version = "v3.1.0"
source = "github"

[[dependencies]]
name = "aiken-lang/fuzz"
version = "v2"
source = "github"

